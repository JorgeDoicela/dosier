services:
  # ---------------------------------------------------------------------------
  # 1. Base de Datos Relacional (MySQL 8.0 con Auto-Inicialización de Scripts)
  # ---------------------------------------------------------------------------
  dosier-db:
    image: mysql:8.0
    container_name: dosier-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-allowed-packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: sigafi_es
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/base_datos:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    networks:
      - dosier-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${DB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 2. Backend ASP.NET Core (.NET 8 Web API)
  # ---------------------------------------------------------------------------
  dosier-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jorgedoicela/dosier-backend:latest}
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: dosier-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      # Conexión a MySQL por nombre de red Docker (no por IP del host)
      - ConnectionStrings__default_connection=Server=dosier-db;Port=3306;Database=sigafi_es;User=root;Password=${DB_ROOT_PASSWORD};CharSet=utf8mb4;
      - ConnectionStrings__DefaultConnection=Server=dosier-db;Port=3306;Database=sigafi_es;User=root;Password=${DB_ROOT_PASSWORD};CharSet=utf8mb4;
      - Jwt__Secret=${JWT_SECRET:-DOSIER_JWT_zsJpOeYEHWFI8QL0dnTxolGUMywNPZB9V512Da3C7biXrtgf}
      - JWTSettings__Secret=${JWT_SETTINGS_SECRET:-DOSIER_SSO_Q612U9OpgHkBdhXTsAonNFC0jzSviWel73rftxRbyE5wMIac}
      - Jwt__Issuer=DosierApi
      - Jwt__Audience=DosierClients
      # FrontendUrl controla CORS y links en emails — apunta al túnel o frontend activo
      - FrontendUrl=${FRONTEND_URL:-http://localhost:80}
      - Security__SuperAdminCedula=${SECURITY_SUPER_ADMIN_CEDULA}
      - Security__MasterAdminId=${SECURITY_MASTER_ADMIN_ID}
    env_file:
      - .env
    volumes:
      - ${UPLOADS_PATH:-./backend/dosier_api/uploads}:/app/uploads
      - ${BACKUPS_PATH:-./backend/dosier_api/backups}:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      dosier-db:
        condition: service_healthy
    networks:
      - dosier-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 3. Frontend Web (React 18 + Vite + Nginx SPA + SSL)
  # ---------------------------------------------------------------------------
  dosier-web:
    image: ${FRONTEND_IMAGE:-ghcr.io/jorgedoicela/dosier-web:latest}
    build:
      context: ./dosier_web
      dockerfile: Dockerfile
    container_name: dosier-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      - ${CERTS_PATH:-./certs}:/etc/nginx/certs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      dosier-backend:
        condition: service_started
    networks:
      - dosier-network

  # ---------------------------------------------------------------------------
  # 4. Cloudflare Tunnel (Acceso Remoto HTTPS Público Gratuito / Cero Costos)
  # ---------------------------------------------------------------------------
  dosier-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dosier-tunnel
    restart: unless-stopped
    # Quick Tunnel: genera URL HTTPS pública temporal sin cuenta ni dominio.
    # La URL tipo https://xxxx.trycloudflare.com se imprime en los logs.
    # Uso: docker compose --profile tunnel up dosier-tunnel
    command: tunnel --no-autoupdate --url http://dosier-web:80
    networks:
      - dosier-network
    depends_on:
      dosier-web:
        condition: service_started
    profiles:
      - tunnel

networks:
  dosier-network:
    driver: bridge

volumes:
  mysql_data:
