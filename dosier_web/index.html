<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_fondo_negro.png" />
    <link rel="shortcut icon" href="/logo_fondo_negro.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DOSIER - Sistema Integral de Portafolio Docente, Planificación Curricular y Acreditación CACES del Instituto Superior Tecnológico Traversari (ISTPET)." />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>DOSIER | Portafolio Docente ISTPET</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            let theme = savedTheme;
            if (theme !== 'dark' && theme !== 'light') {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
